data:
  raw_path: data/raw/dataset.csv
  processed_dir: data/processed
  target: target
  test_size: 0.2
  random_state: 42

validation:
  min_rows: 200
  max_null_fraction: 0.0
  min_minority_class_fraction: 0.2

train:
  model_type: random_forest   # logistic_regression | random_forest | gradient_boosting
  random_state: 42
  logistic_regression:
    C: 1.0
    max_iter: 2000
  random_forest:
    n_estimators: 200
    max_depth: 8
  gradient_boosting:
    n_estimators: 150
    learning_rate: 0.1
    max_depth: 3

quality_gate:
  min_f1: 0.90
  min_recall: 0.90
  max_train_test_f1_gap: 0.08

mlflow:
  experiment_name: breast-cancer-classifier
  registered_model: breast-cancer-classifier
  champion_alias: champion

paths:
  model_dir: models
  run_info: models/run_info.json
  metrics: reports/metrics.json

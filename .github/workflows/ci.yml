name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[tools,ml,dev]"
      - name: Pytest (all external services mocked)
        run: pytest -m "not integration" --cov=agent --cov=api --cov=inference --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml

  pipeline-smoke:
    name: Training pipeline smoke test
    runs-on: ubuntu-latest
    needs: lint
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # provenance reads git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[ml]"
      - name: Generate dataset v2 and run validate -> preprocess -> train -> evaluate -> gate -> promote
        run: |
          python -m training.make_dataset --version v2
          python -m training.validate
          python -m training.preprocess
          python -m training.train
          python -m training.evaluate
          python -m training.quality_gate
          python -m training.promote
      - name: Corrupt data must be rejected by validation
        run: |
          python -m training.make_dataset --version corrupt
          if python -m training.validate; then echo "validation should have failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: reports/metrics.json

  dag-integrity:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    needs: lint
    env:
      AIRFLOW_VERSION: "3.1.0"
      PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Airflow (official constraints)
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - name: Parse DAGs and check structure
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          REPO_ROOT: ${{ github.workspace }}
        run: |
          airflow db migrate > /dev/null
          python - <<'EOF'
          try:
              from airflow.dag_processing.dagbag import DagBag
          except ImportError:
              from airflow.models.dagbag import DagBag
          bag = DagBag("dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          dag = bag.dags["training_pipeline"]
          expected = ["validate_dataset", "preprocess_data", "train_model",
                      "evaluate_and_log_mlflow", "apply_quality_gate", "promote_model"]
          assert sorted(dag.task_ids) == sorted(expected), dag.task_ids
          for up, down in zip(expected, expected[1:]):
              assert down in dag.get_task(up).downstream_task_ids, (up, down)
          assert dag.default_args["retries"] >= 1
          print("DAG OK:", dag.task_ids)
          EOF

  manifests:
    name: Kubernetes manifests + compose validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests (strict)
        run: kubectl kustomize kubernetes | kubeconform -strict -summary -
      - name: Policy checks (replicas, probes, resources, ClusterIP)
        run: |
          python3 - <<'EOF'
          import yaml
          dep = yaml.safe_load(open("kubernetes/deployment.yaml"))
          c = dep["spec"]["template"]["spec"]["containers"][0]
          assert dep["spec"]["replicas"] >= 2
          assert "readinessProbe" in c and "livenessProbe" in c
          assert {"cpu", "memory"} <= set(c["resources"]["requests"]) and {"cpu", "memory"} <= set(c["resources"]["limits"])
          assert yaml.safe_load(open("kubernetes/service.yaml"))["spec"]["type"] == "ClusterIP"
          print("manifest policy OK")
          EOF
      - name: docker compose config
        run: docker compose -f infra/docker-compose.yaml config -q

  docker-build:
    name: Build images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ml-inference:ci
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=inference
          cache-to: type=gha,mode=max,scope=inference
      - name: Smoke test inference container
        run: |
          docker run -d --name inf -p 8000:8000 ml-inference:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health/ready && break; sleep 1; done
          curl -sf localhost:8000/version
          docker logs inf
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: false
          tags: mlops-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

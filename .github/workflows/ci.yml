name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[tools,ml,dev]"
      - name: Pytest (all external services mocked)
        run: pytest -m "not integration" --cov=agent --cov=api --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml

  pipeline-smoke:
    name: Training pipeline smoke test
    runs-on: ubuntu-latest
    needs: lint
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # provenance reads git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[ml]"
      - name: Generate dataset v2 and run validate -> preprocess -> train -> evaluate -> gate
        run: |
          python -m training.make_dataset --version v2
          python -m training.validate
          python -m training.preprocess
          python -m training.train
          python -m training.evaluate
          python -m training.quality_gate
      - name: Corrupt data must be rejected by validation
        run: |
          python -m training.make_dataset --version corrupt
          if python -m training.validate; then echo "validation should have failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: reports/metrics.json

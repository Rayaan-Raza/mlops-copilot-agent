[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-copilot-agent"
version = "0.1.0"
description = "Production-ready MLOps AI agent integrating DVC, MLflow, Airflow and Kubernetes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
# Clients for the four MLOps systems the agent talks to.
tools = [
    "mlflow-skinny>=2.12",
    "kubernetes>=29.0",
]
# LLM providers (install the one you use).
llm = [
    "anthropic>=0.40",
    "openai>=1.40",
]
# Training / data pipeline.
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "mlflow>=2.12",
    "dvc>=3.50",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
mlops-agent = "agent.main:cli"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*", "inference*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["infra/airflow"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess without shell is intentional (allow-listed)
    "S607",  # partial executable path (dvc / git resolved from PATH)
    "B008",  # FastAPI Depends() in defaults
    "E501",  # line length is handled by `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires live DVC/MLflow/Airflow/Kubernetes services (skipped in CI)",
]
